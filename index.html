<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nextora Creations | Invoicing</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <link rel="icon" type="image/webp" href="/logo.webp">
  <link rel="icon" type="image/png" href="/logo.png">

  <!-- Same font and icon families as the Nextora Creations website. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body class="bg-surface text-on-surface font-body antialiased">
  <div id="app" class="min-h-screen"></div>
  <div id="toasts" class="fixed bottom-6 right-6 z-[60] flex flex-col gap-2 print:hidden" role="status" aria-live="polite"></div>
  <div id="modal-root" class="print:hidden"></div>
  <!-- Direct child of body so the print stylesheet can hide every sibling and keep the sheet. -->
  <div id="print-root" class="hidden"></div>
  <script type="module" src="/src/main.js"></script>

</html>
